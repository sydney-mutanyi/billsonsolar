services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billsonsolar_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    networks:
      - billsonsolar_network
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: billsonsolar_nginx
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - billsonsolar_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  db:
    image: mysql:8.0
    container_name: billsonsolar_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-billsonsolar}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-billsonsolar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - billsonsolar_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  billsonsolar_network:

volumes:
  mysql_data:
